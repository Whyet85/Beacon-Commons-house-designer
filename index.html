
<script>
(async function () {
  const db = window.supabase.createClient(
    "https://ufydnfjhycjhdwxfamtv.supabase.co",
    "sb_publishable_XmSkql73XBrQORWDB16dDA_3LD1-ZyR"
  );

  const status = document.getElementById("status");
  const saveButton = document.getElementById("save");
  const viewer = document.getElementById("viewer");

  const { data: { user } } = await db.auth.getUser();

  if (!user) return;

  const { data: house, error } = await db
    .from("Houses")
    .select("*")
    .eq("owner_id", user.id)
    .maybeSingle();

  if (error || !house) {
    status.textContent = "Your house could not be found.";
    return;
  }

  viewer.value = house.username || "";

  if (house.colors) {
    for (const [part, color] of Object.entries(house.colors)) {
      if (!(part in colorState)) continue;
      if (!/^#[0-9a-f]{6}$/i.test(color)) continue;

      colorState[part] = color;

      const input = document.getElementById(part);
      if (input) {
        input.value = color;
        const label = input.nextElementSibling;
        if (label) label.textContent = color;
      }
    }
    draw();
  }

  status.textContent = "Your house is connected.";

  saveButton.onclick = async function () {
    const { error } = await db
      .from("Houses")
      .update({ colors: { ...colorState } })
      .eq("id", house.id)
      .eq("owner_id", user.id);

    status.textContent = error
      ? "Could not save: " + error.message
      : "Your house colors have been saved!";
  };
})();
</script>
